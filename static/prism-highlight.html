<!-- 
--code-highlight-kw-color: #ff7733;
--code-highlight-kw-2-color: #ff7733;
--code-highlight-lifetime-color: #ff7733;
--code-highlight-prelude-color: #69f2df;
--code-highlight-prelude-val-color: #ff7733;
--code-highlight-number-color: #b8cc52;
--code-highlight-string-color: #b8cc52;
--code-highlight-literal-color: #ff7733;
--code-highlight-attribute-color: #e6e1cf;
--code-highlight-self-color: #36a3d9;
--code-highlight-macro-color: #a37acc;
--code-highlight-question-mark-color: #ff9011;
--code-highlight-comment-color: #788797;
--code-highlight-doc-comment-color: #a1ac88; 
-->

<style>
  .token.cdata,
  .token.comment,
  .token.doctype,
  .token.prolog {
    color: var(--code-highlight-comment-color);
  }

  .token.punctuation {
    color: var(--stab-code-color);
  }

  .token.boolean {
    color: var(--code-highlight-literal-color);
  }

  .token.number {
    color: var(--code-highlight-number-color);
  }

  /* .token.constant,
  .token.deleted,
  .token.property,
  .token.symbol,
  .token.tag {
    color: var(--code-highlight-macro-color);
  } */

  .token.attr-name,
  .token.builtin,
  .token.char,
  .token.inserted,
  .token.selector,
  .token.string {
    color: var(--code-highlight-string-color);
  }

  /* .language-css .token.string,
    .style .token.string,
    .token.entity,
    .token.operator,
    .token.url {
        
    } */

  .token.atrule,
  .token.attr-value,
  .token.keyword {
    color: var(--code-highlight-kw-color);
  }

  .token.class-name {
    color: var(--code-highlight-kw-color);
  }

  /* .token.function {
    color: var(--code-highlight-attribute-color);
  } */

  /* .token.important,
  .token.regex,
  .token.variable {
    color: var(--code-highlight-kw-2-color);
  } */

  .token.bold,
  .token.important {
    font-weight: 700;
  }

  .token.italic {
    font-style: italic;
  }

  .token.entity {
    cursor: help;
  }
</style>

<script>
  window.Prism = window.Prism || {};
  Prism.manual = true;
</script>

<script src="https://cdn.jsdelivr.net/npm/prismjs@1/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markup-templating.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-django.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const langs = ["toml", "sh", "shell", "bash", "django", "jinja2"];

    for (const lang of langs) {
      document.querySelectorAll(`pre.language-${lang} > code`).forEach((element) => {
        console.log("HI", element, lang);
        element.classList.add(`language-${lang}`);
        Prism.highlightElement(element);
      });
    }
  });
</script>
