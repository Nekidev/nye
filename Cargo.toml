[workspace]
resolver = "3"
members = [
    "crates/nye",
    "crates/nye-environment",
    "crates/nye-keyring-daemon",
    "crates/nye-keyring-daemon-protocol",
    "crates/nye-namespaces",
    "crates/nye-namespaces-toasty",
    "crates/nye-packages",
    "crates/nye-projects",
    "crates/nye-registry",
    "crates/nye-registry-http-client",
    "crates/nye-registry-http-server",
    "crates/nye-registry-local-client",
    "crates/nye-schemas",
    "crates/nye-utils",
    "crates/nye-validation",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license-file = "LICENSE"

[profile.release]
opt-level = 3
debug = false
strip = true
overflow-checks = false
lto = true
incremental = false
codegen-units = 1
