[package]
name = "nye"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Nyeki's package manager."
default-run = "nye"

[lib]
doctest = false

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
argon2 = "0.6.0"
askama = "0.16.1"
async_zip = { version = "0.0.19", features = ["tokio", "tokio-fs"], default-features = false }
axum = { version = "0.8.9", optional = true, features = ["http2", "multipart"] }
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
colored = "3.1.1"
dedent = "0.1.1"
dotenvy = "0.15.7"
duckity = "1.1.1"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", features = ["io"] }
globwalk = "0.9.1"
indicatif = { version = "0.18.6", features = ["tokio"] }
jiff = { version = "0.2.35", features = ["static-tz"] }
nanoid = "0.5.0"
path-clean = "1.0.1"
pathdiff = "0.2.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true, features = ["preserve_order"] }
shellexpand = "3.1.2"
tabled = "0.22.0"
toasty = { version = "0.10.0", features = ["sqlite", "jiff", "migration"] }
toasty-cli = "0.10.0"
toasty-core = "0.10.0"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
] }
tokio-util = { version = "0.7.19", features = ["futures-io", "io", "io-util"] }
toml = { version = "1.1.4", features = ["preserve_order", "serde"] }
url = { version = "2.5.8", features = ["serde"] }
users = "0.11.0"
validator = "0.21.0"
zxcvbn = { version = "3.1.1" }

[features]
default = ["registry"]
registry = ["dep:axum", "dep:serde_json", "toasty/postgresql", "tokio/signal", "tokio/time"]

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
debug = false
overflow-checks = false
incremental = false
