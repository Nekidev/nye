[package]
name = "nye"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Nyeki's package manager."
default-run = "nye"

[lib]
doctest = false

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
argon2 = "0.6.0"
askama = "0.16.1"
async_zip = { version = "0.0.19", features = [
    "tokio",
    "tokio-fs",
], default-features = false }
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-sdk-s3 = { version = "1.146.1", features = ["behavior-version-latest"] }
axum = { version = "0.8.9", features = ["http2", "multipart"] }
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
colored = "3.1.1"
dedent = "0.1.1"
dialoguer = "0.12.0"
dotenvy = "0.15.7"
duckity = "1.1.1"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", features = ["io"] }
globwalk = "0.9.1"
http = "1.5.0"
indicatif = { version = "0.18.6", features = ["tokio"] }
jiff = { version = "0.2.35", features = ["static-tz"] }
linux-keyutils = { version = "0.2.5", features = ["std"] }
nanoid = "0.5.0"
nye-environment = { version = "0.1.0", path = "../nye-environment" }
nye-schemas = { version = "0.1.0", path = "../nye-schemas" }
nye-utils = { version = "0.1.0", path = "../nye-utils" }
nye-validation = { version = "0.1.0", path = "../nye-validation" }
path-clean = "1.0.1"
pathdiff = "0.2.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = [
    "brotli",
    "gzip",
    "json",
    "multipart",
    "zstd",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
shellexpand = "3.1.2"
tabled = "0.22.0"
toasty = { version = "0.10.0", features = [
    "sqlite",
    "postgresql",
    "jiff",
    "migration",
] }
toasty-cli = "0.10.0"
toasty-core = "0.10.0"
tokio = { version = "1.53.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "signal",
    "time",
] }
tokio-util = { version = "0.7.19", features = ["futures-io", "io", "io-util"] }
toml = { version = "1.1.4", features = ["preserve_order", "serde"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
url = { version = "2.5.8", features = ["serde"] }
users = "0.11.0"
validator = { version = "0.21.0", default-features = false }
zxcvbn = { version = "3.1.1" }
