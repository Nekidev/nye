[package]
name = "nye-namespaces"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
askama = "0.16.1"
nye-packages = { path = "../nye-packages" }
nye-schemas = { path = "../nye-schemas" }
nye-utils = { path = "../nye-utils" }
shellexpand = "3.1.2"
toasty = { version = "0.11.0", features = ["migration", "sqlite"] }
tokio = { version = "1.53.1", features = ["fs"] }
users = "0.11.0"
