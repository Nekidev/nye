[package]
name = "nye-registry"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
argon2 = { version = "0.6.0", features = ["parallel"] }
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-sdk-s3 = "1.148.0"
axum = { version = "0.8.9", features = ["multipart", "http2"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
colored = "3.1.1"
duckity = "1.1.2"
http = "1.5.0"
nanoid = "0.5.0"
nye-packages = { version = "0.1.0", path = "../nye-packages" }
nye-schemas = { version = "0.1.0", path = "../nye-schemas" }
nye-utils = { version = "0.1.0", path = "../nye-utils" }
nye-validation = { version = "0.1.0", path = "../nye-validation" }
serde = { version = "1.0.229", features = ["derive"] }
toasty = { version = "0.10.0", features = ["migration", "postgresql"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "fs"] }
tower-http = { version = "0.7.1", features = ["fs"] }
url = { version = "2.5.8", features = ["serde"] }
validator = "0.21.0"
zxcvbn = "3.1.1"
